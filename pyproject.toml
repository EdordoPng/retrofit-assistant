[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retrofit-assistant"
version = "0.1.0"
description = "Advisory operator-assist layer for the RETROFIT AI 2026 challenge"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrofit_assistant = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-markers -m "not slow"'
markers = [
    "slow: complete causality truncation run, excluded by default",
]
